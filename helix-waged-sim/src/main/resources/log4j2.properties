status = error
name = waged-sim
appender.console.type = Console
appender.console.name = STDERR
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n
rootLogger.level = error
rootLogger.appenderRef.stderr.ref = STDERR
logger.wagedsim.name = org.apache.helix.wagedsim
logger.wagedsim.level = info
# The dry run asks for another pipeline run after a partial pass; the next round is that run.
logger.rebalanceutil.name = org.apache.helix.util.RebalanceUtil
logger.rebalanceutil.level = off
# WAGED failures are recorded per round, in rounds.jsonl and in the report; their stack traces would
# only repeat them. A scale-down search fails WAGED on purpose.
logger.wagedrebalancer.name = org.apache.helix.controller.rebalancer.waged.WagedRebalancer
logger.wagedrebalancer.level = off
logger.globalrebalance.name = org.apache.helix.controller.rebalancer.waged.GlobalRebalanceRunner
logger.globalrebalance.level = off
logger.partialrebalance.name = org.apache.helix.controller.rebalancer.waged.PartialRebalanceRunner
logger.partialrebalance.level = off
