name: replay
description: >-
  Run the controller's normal pipeline on the cluster as copied, with no changes, until nothing moves.
  Shows whether WAGED would move anything from the served layout, and the starting stats.
settings:
  firstRound: steady
exit:
  stableFor: 2
  maxRounds: 10
  timeout: 30m
