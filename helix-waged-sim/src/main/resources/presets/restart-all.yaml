name: restart-all
description: >-
  A rolling restart: one random instance restarts in each of the first ten rounds. Inside the delay
  window replicas stay put, so this mostly moves top states. Ends when nothing moves for two rounds.
events:
  - every: 1
    times: 10
    restart: random:1
exit:
  stableFor: 2
  maxRounds: 20
  timeout: 60m
