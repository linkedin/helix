name: converge
description: >-
  Restart the controller and run pipeline rounds until nothing moves for three rounds: shows how much
  a controller restart (global pass) churns, and whether WAGED settles.
settings:
  firstRound: restart
exit:
  stableFor: 3
  maxRounds: 20
  timeout: 60m
