name: scale-down-worst-case
description: >-
  How many instances can be removed when the scale-down cannot choose which ones go. Each variant is
  another removal order, and the lowest answer is what such a scale-down can count on. mz-balanced is
  the best case (zones kept even); mz-tightest piles removals into the tightest, usually smallest,
  zone, the worst case for zone spread and for surviving a zone loss; most-loaded takes the busiest
  instances first; mz-single empties the largest zone first; random-N are arbitrary removals. The
  zone-loss variants must also survive losing the largest zone afterwards, and the without-down
  variants plan without disabled or offline instances.
search:
  removeNodes:
    strategy: mz-balanced
    method: binary
variants:
  mz-balanced: {}
  mz-tightest: {searchStrategy: mz-tightest}
  most-loaded: {searchStrategy: most-loaded}
  mz-single: {searchStrategy: mz-single}
  random-1: {searchStrategy: random, seed: 1}
  random-2: {searchStrategy: random, seed: 2}
  random-3: {searchStrategy: random, seed: 3}
  mz-balanced-zone-loss: {tolerateZoneLoss: largest}
  mz-tightest-zone-loss: {searchStrategy: mz-tightest, tolerateZoneLoss: largest}
  random-1-zone-loss: {searchStrategy: random, seed: 1, tolerateZoneLoss: largest}
  mz-tightest-without-down: {searchStrategy: mz-tightest, nonServing: remove}
  mz-tightest-zone-loss-without-down: {searchStrategy: mz-tightest, tolerateZoneLoss: largest, nonServing: remove}
exit:
  timeout: 120m
report:
  perNode: [start, end]
