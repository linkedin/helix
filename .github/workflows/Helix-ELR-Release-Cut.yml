name: ELR Release Cut on Version Bump Merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write

jobs:
  cut-release-and-trigger-elr:
    # Only run when the version-bump PR (labelled elr-release-cut) is merged
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'elr-release-cut')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v3
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.ELR_TRIGGER_PAT }}

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute release version from dev pom.xml
        id: release
        run: |
          # dev pom.xml now has the bumped SNAPSHOT (e.g. 1.6.1-SNAPSHOT) after the merge
          SNAPSHOT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION=${SNAPSHOT_VERSION%-SNAPSHOT}
          TIMESTAMP=$(date +%Y%m%d%H%M)
          RELEASE_VERSION="${BASE_VERSION}-dev-${TIMESTAMP}"
          BRANCH="release_${RELEASE_VERSION}"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Cutting release: branch=$BRANCH version=$RELEASE_VERSION"

      - name: Cut release branch and set pom.xml version
        run: |
          git checkout -b "${{ steps.release.outputs.branch }}"
          mvn versions:set -DnewVersion="${{ steps.release.outputs.release_version }}" -DgenerateBackupPoms=false
          git add -A
          git commit -m "Set release version to ${{ steps.release.outputs.release_version }}"
          git push origin "${{ steps.release.outputs.branch }}"

      - name: Dispatch ELR publish workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ELR_TRIGGER_PAT }}
          script: |
            const branch = '${{ steps.release.outputs.branch }}';
            const version = '${{ steps.release.outputs.release_version }}';
            console.log(`Triggering ELR: branch=${branch} version=${version}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'linkedin',
              repo: 'helix-elr',
              workflow_id: 'publish-linkedin-jfrog.yml',
              ref: 'helix-elr-main',
              inputs: {
                version: version,
                branch: branch,
                repo: 'linkedin/helix',
                jdk_build_version: '11',
                jdk_release_version: '11',
              }
            });
            console.log('ELR workflow dispatch triggered successfully.');
