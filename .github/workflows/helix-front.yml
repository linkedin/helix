name: Helix Front CI
on:
  pull_request:
    branches: [master]
    paths:
      - "helix-front/**"

jobs:
  CI:
    name: helix-front CI
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out the repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Install dependencies
        run: |
          npm install --ignore-engines 2>&1 | tail -5
          echo "Installed @angular/common version:"
          node -e "console.log(require('@angular/common/package.json').version)"
        working-directory: helix-front

      - name: Format check
        run: npx prettier --check .
        working-directory: helix-front

      - name: Build
        run: |
          cp server/config.example.ts server/config.ts
          npx ng build --aot --configuration production
          npx tsc -p server
        working-directory: helix-front
