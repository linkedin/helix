name: Helix Front CI
on:
  pull_request:
    branches: [master]
    paths:
      - "helix-front/**"

jobs:
  CI:
    name: helix-front CI
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out the repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Debug registry tarball
        run: |
          echo "=== Checking @angular/common@13.3.9 from registry ==="
          curl -sL "https://registry.yarnpkg.com/@angular/common/-/common-13.3.9.tgz" -o /tmp/angular-test.tgz
          mkdir -p /tmp/angular-test && tar xzf /tmp/angular-test.tgz -C /tmp/angular-test
          echo "Version in tarball:"
          python3 -c "import json; print(json.load(open('/tmp/angular-test/package/package.json'))['version'])"
          ls /tmp/angular-test/package/ | head -10
          echo "=== Checking npm registry response ==="
          curl -s "https://registry.yarnpkg.com/@angular/common/13.3.9" | python3 -c "import sys,json; d=json.load(sys.stdin); print('version:', d['version']); print('tarball:', d['dist']['tarball'])"

      - name: Install and verify
        run: |
          yarn --ignore-engines
          echo "=== Installed version ==="
          python3 -c "import json; print(json.load(open('node_modules/@angular/common/package.json'))['version'])"
          echo "=== yarn.lock entry ==="
          grep -A 3 'angular/common@13.3.9' yarn.lock
          echo "=== Check .npmrc ==="
          cat .npmrc
        working-directory: helix-front
