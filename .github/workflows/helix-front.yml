name: Helix Front CI
on:
  pull_request:
    branches: [master]
    paths:
      - "helix-front/**"

jobs:
  CI:
    name: helix-front CI
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out the repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"
          cache: "yarn"
          cache-dependency-path: "helix-front/yarn.lock"

      - name: Install dependencies
        run: |
          yarn cache clean
          yarn --frozen-lockfile --ignore-engines
        working-directory: helix-front

      - name: Debug angular version
        run: |
          cat node_modules/@angular/common/package.json | python3 -c "import sys,json; print('Installed @angular/common version:', json.load(sys.stdin)['version'])"
          ls node_modules/@angular/common/ | head -20
        working-directory: helix-front

      - name: Format check
        run: yarn format:check
        working-directory: helix-front

      - name: Build
        run: yarn prepack
        working-directory: helix-front
