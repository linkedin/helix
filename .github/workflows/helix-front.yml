name: Helix Front CI
on:
  pull_request:
    branches: [master]
    paths:
      - "helix-front/**"

jobs:
  CI:
    name: helix-front CI
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out the repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Install dependencies
        run: |
          yarn cache clean
          yarn --ignore-engines
          echo "=== Installed @angular/common ==="
          python3 -c "import json; print(json.load(open('node_modules/@angular/common/package.json'))['version'])"
        working-directory: helix-front

      - name: Format check
        run: yarn format:check
        working-directory: helix-front

      - name: Build
        run: yarn prepack
        working-directory: helix-front
