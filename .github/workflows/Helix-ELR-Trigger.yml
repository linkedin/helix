name: Scheduled ELR Release

on:
  schedule:
    # Runs twice a week: Monday and Thursday at 06:00 UTC
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 4'
  # Allow manual trigger for testing or ad-hoc releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release-and-trigger-elr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v3
        with:
          ref: dev
          # PAT needed so the pushed branch can trigger other workflows
          token: ${{ secrets.ELR_TRIGGER_PAT }}

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Derive release version from pom.xml
        id: version
        run: |
          SNAPSHOT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION=${SNAPSHOT_VERSION%-SNAPSHOT}
          TIMESTAMP=$(date +%Y%m%d%H%M)
          RELEASE_VERSION="${BASE_VERSION}-dev-${TIMESTAMP}"
          BRANCH="release_${RELEASE_VERSION}"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Derived version: $RELEASE_VERSION, branch: $BRANCH"

      - name: Create release branch and bump pom.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.version.outputs.branch }}"
          mvn versions:set -DnewVersion="${{ steps.version.outputs.release_version }}" -DgenerateBackupPoms=false
          git add -A
          git commit -m "Set release version to ${{ steps.version.outputs.release_version }}"
          git push origin "${{ steps.version.outputs.branch }}"

      - name: Dispatch ELR publish workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ELR_TRIGGER_PAT }}
          script: |
            const branch = '${{ steps.version.outputs.branch }}';
            const version = '${{ steps.version.outputs.release_version }}';

            console.log(`Triggering ELR for branch: ${branch}, version: ${version}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: 'linkedin',
              repo: 'helix-elr',
              workflow_id: 'publish-linkedin-jfrog.yml',
              ref: 'helix-elr-main',
              inputs: {
                version: version,
                branch: branch,
                repo: 'linkedin/helix',
                jdk_build_version: '11',
                jdk_release_version: '11',
              }
            });

            console.log('ELR workflow dispatch triggered successfully.');
