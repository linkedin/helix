<section>
  <hi-list-status
    [loading]="isLoading"
    [error]="error"
    [count]="instances ? instances.length : null"
    [updated]="updated"
    label="instances"
    [hint]="hint"
    emptyText="No instances match this filter."
    (refresh)="load()"
  ></hi-list-status>

  <div class="filter-bar">
    <button
      type="button"
      class="filter-chip"
      data-filter="all"
      [class.active]="filter === 'all'"
      [attr.aria-pressed]="filter === 'all'"
      (click)="setFilter('all')"
    >
      All ({{ count('all') }})
    </button>
    <button
      type="button"
      class="filter-chip"
      data-filter="membership"
      [class.active]="filter === 'membership'"
      [attr.aria-pressed]="filter === 'membership'"
      (click)="setFilter('membership')"
    >
      Membership issues ({{ count('membership') }})
    </button>
    <button
      type="button"
      class="filter-chip"
      data-filter="offline"
      [class.active]="filter === 'offline'"
      [attr.aria-pressed]="filter === 'offline'"
      title="No live ZooKeeper session, regardless of instance operation."
      (click)="setFilter('offline')"
    >
      Offline ({{ count('offline') }})
    </button>
    <button
      *ngFor="let operation of operationFilters"
      type="button"
      class="filter-chip"
      [attr.data-operation]="operation.state"
      [class.active]="filter === operation.filter"
      [attr.aria-pressed]="filter === operation.filter"
      [title]="
        operation.state + ' operation. Includes live and offline instances.'
      "
      (click)="setFilter(operation.filter)"
    >
      {{ operation.label }} ({{ count(operation.filter) }})
    </button>
  </div>

  <ngx-datatable
    #instancesTable
    class="material"
    [headerHeight]="headerHeight"
    [rowHeight]="'auto'"
    columnMode="force"
    [scrollbarH]="true"
    [footerHeight]="rowHeight"
    [rows]="instances"
    [loadingIndicator]="isLoading"
    selectionType="single"
    [sorts]="sorts"
    (select)="onSelect($event)"
    (resize)="widths.save($event)"
  >
    <ngx-datatable-column
      name="Live"
      prop="online"
      [width]="60"
      [resizeable]="false"
      [draggable]="false"
      [canAutoResize]="false"
    >
      <ng-template let-row="row" ngx-datatable-cell-template>
        <mat-icon
          *ngIf="row.online"
          class="status-healthy"
          matTooltip="Live: the instance holds a ZooKeeper session. This does not indicate the host process is healthy."
          >check_circle</mat-icon
        >
        <mat-icon
          *ngIf="!row.online"
          class="status-offline"
          matTooltip="Offline: no ZooKeeper session."
          >cancel</mat-icon
        >
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Name" [width]="widths.get('Name', 240)" [minWidth]="180">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <section fxLayout="row" fxLayoutAlign="start center">
          <span class="name" [title]="row.name"
            ><span class="ellipsis">{{ nameHead(row.name) }}</span
            ><span class="name-tail">{{ nameTail(row.name) }}</span></span
          >
          <hi-disabled-label
            *ngIf="row.operationState === 'DISABLE'"
            text="DISABLED"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'UNKNOWN'"
            text="UNKNOWN"
            class="label-unknown"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'EVACUATE'"
            text="EVACUATING"
            class="label-evacuate"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'SWAP_IN'"
            text="SWAP IN"
            class="label-swap-in"
          ></hi-disabled-label>
        </section>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Domain"
      prop="summary.domain"
      [width]="widths.get('Domain', 320)" [minWidth]="200"
    >
      <ng-template let-value="value" ngx-datatable-cell-template>
        <span class="mono domain" [title]="value || ''"
          ><span *ngFor="let pair of domainPairs(value)" class="domain-pair">{{
            pair
          }}</span></span
        >
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Tags" prop="summary.tags" [width]="widths.get('Tags', 70)" [sortable]="false">
      <ng-template let-value="value" ngx-datatable-cell-template>
        {{ value ? value.join(', ') : '' }}
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Operations"
      [width]="widths.get('Operations', 230)" [minWidth]="190"
      [sortable]="false"
    >
      <ng-template let-row="row" ngx-datatable-cell-template>
        <ng-container *ngIf="operations(row) as ops">
          <ng-container *ngIf="current(ops) as active">
            <button
              type="button"
              class="op-chip op-current"
              [attr.data-operation]="active.entry.operation"
              [matMenuTriggerFor]="history"
              #trigger="matMenuTrigger"
              [matTooltip]="summary(ops)"
              [matTooltipDisabled]="trigger.menuOpen"
              [attr.aria-label]="summary(ops)"
              (click)="$event.stopPropagation()"
            >
              {{ active.entry.operation }} &middot;
              {{ active.entry.source || 'unknown' }}
              <span *ngIf="active.atMillis" class="op-age">{{
                age(active.atMillis)
              }}</span>
              <span *ngIf="ops.length > 1" class="op-more"
                >+{{ ops.length - 1 }}</span
              >
            </button>
            <mat-menu #history="matMenu" class="op-history">
              <div class="op-history-title">
                Operation history, newest first
              </div>
              <button
                mat-menu-item
                type="button"
                *ngFor="let op of newestFirst(row)"
                class="op-entry op-history-entry"
                [class.active]="op.active"
              >
                <span class="op-chip" [attr.data-operation]="op.entry.operation"
                  >{{ op.entry.operation }} &middot;
                  {{ op.entry.source || 'unknown' }}</span
                >
                <span class="op-detail"
                  ><b *ngIf="op.active">active &middot; </b
                  >{{ operationDetail(op) }}</span
                >
              </button>
            </mat-menu>
          </ng-container>
        </ng-container>
        <span
          *ngIf="markerUntil(row)"
          class="op-chip marker"
          [matTooltip]="
            'Maintenance marker: ACM holds this instance until ' +
            markerUntil(row) +
            '.'
          "
          >marker</span
        >
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Capacity"
      [width]="widths.get('Capacity', 130)" [minWidth]="110"
      [sortable]="false"
    >
      <ng-template let-row="row" ngx-datatable-cell-template>
        <span class="mono">{{ capacityText(row) }}</span>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Errors"
      [width]="widths.get('Errors', 70)"
      [sortable]="false"
    >
      <ng-template let-row="row" ngx-datatable-cell-template>
        <span
          *ngIf="errorsPending"
          title="Reading error counts."
          >...</span
        >
        <span
          *ngIf="!errorsPending && errorCount(row) === null"
          title="Error counts could not be read."
          >n/a</span
        >
        <span
          *ngIf="!errorsPending && errorCount(row) > 0"
          class="op-chip error"
          [title]="errorTitle(row)"
          >{{ errorCount(row) }}</span
        >
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</section>
