<section>
  <ngx-datatable
    #instancesTable
    class="material"
    [headerHeight]="headerHeight"
    [rowHeight]="rowHeight"
    columnMode="force"
    [footerHeight]="rowHeight"
    [rows]="instances"
    [loadingIndicator]="isLoading"
    selectionType="single"
    [sorts]="sorts"
    (select)="onSelect($event)"
  >
    <ngx-datatable-column
      name="Status"
      prop="healthy"
      [width]="85"
      [resizeable]="false"
      [draggable]="false"
      [canAutoResize]="false"
    >
      <ng-template let-row="row" ngx-datatable-cell-template>
        <mat-icon *ngIf="row.healthy" class="status-healthy"
          >check_circle</mat-icon
        >
        <mat-icon
          *ngIf="!row.healthy && row.operationState === 'UNKNOWN'"
          class="status-unknown"
          matTooltip="The instance is in UNKNOWN state."
          >help</mat-icon
        >
        <mat-icon
          *ngIf="!row.healthy && row.operationState === 'EVACUATE'"
          class="status-evacuate"
          matTooltip="The instance is being evacuated."
          >exit_to_app</mat-icon
        >
        <mat-icon
          *ngIf="!row.healthy && row.operationState === 'SWAP_IN'"
          class="status-swap-in"
          matTooltip="The instance is swapping in."
          >swap_horiz</mat-icon
        >
        <mat-icon
          *ngIf="!row.healthy && row.operationState === 'DISABLE'"
          class="status-disabled-icon"
          matTooltip="The instance is disabled."
          >block</mat-icon
        >
        <mat-icon
          *ngIf="!row.healthy && row.operationState === 'ENABLE' && !row.online"
          class="status-offline"
          matTooltip="The instance is offline."
          >cancel</mat-icon
        >
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="Name">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <section fxLayout="row" fxLayoutAlign="start center">
          {{ row.name }}
          <hi-disabled-label
            *ngIf="row.operationState === 'DISABLE'"
            text="DISABLED"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'UNKNOWN'"
            text="UNKNOWN"
            class="label-unknown"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'EVACUATE'"
            text="EVACUATING"
            class="label-evacuate"
          ></hi-disabled-label>
          <hi-disabled-label
            *ngIf="row.operationState === 'SWAP_IN'"
            text="SWAP IN"
            class="label-swap-in"
          ></hi-disabled-label>
        </section>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</section>
