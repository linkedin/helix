<section class="list-status" fxLayout="row" fxLayoutAlign="start center">
  <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>

  <span
    *ngIf="loading && loadingText"
    class="status-message status-loading"
    data-testid="list-status-loading"
  >
    {{ loadingText }}
  </span>

  <span
    *ngIf="error"
    class="status-message status-error"
    data-testid="list-status-error"
  >
    <mat-icon>error_outline</mat-icon>
    Could not load {{ label }}: {{ error }}.
    <ng-container *ngIf="count">Any rows shown may be stale.</ng-container>
  </span>

  <span *ngIf="!error && !loading && updated" class="status-message status-ok">
    Sampled at {{ sampledAt
    }}<span *ngIf="count != null"
      >&nbsp;&middot; {{ count }} {{ countLabel }}</span
    >
    <button
      *ngIf="hint"
      type="button"
      class="hint-button"
      [attr.aria-label]="hint"
      [matTooltip]="hint"
      matTooltipClass="hi-hint-tooltip"
      data-testid="list-status-hint"
    >
      <mat-icon class="hint-icon">info_outline</mat-icon>
    </button>
  </span>

  <span fxFlex="1 1 auto"></span>

  <button
    mat-icon-button
    class="refresh-button"
    (click)="refresh.emit()"
    [disabled]="loading"
    matTooltip="Refresh"
    aria-label="Refresh"
  >
    <mat-icon>refresh</mat-icon>
  </button>
</section>

<section
  *ngIf="!error && showEmpty"
  class="empty-state"
  data-testid="list-status-empty"
>
  <mat-icon>inbox</mat-icon>
  <h3>No {{ label }} found</h3>
  <p *ngIf="emptyText">{{ emptyText }}</p>
</section>
