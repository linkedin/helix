<section class="list-status" fxLayout="row" fxLayoutAlign="start center">
  <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>

  <span
    *ngIf="error"
    class="status-message status-error"
    data-testid="list-status-error"
  >
    <mat-icon>error_outline</mat-icon>
    Could not load {{ label }}: {{ error }}. Any rows shown may be stale.
  </span>

  <span
    *ngIf="!error && showEmpty"
    class="status-message status-empty"
    data-testid="list-status-empty"
  >
    <mat-icon>inbox</mat-icon>
    No {{ label }} found.<span *ngIf="emptyText">&nbsp;{{ emptyText }}</span>
  </span>

  <span
    *ngIf="!error && !showEmpty && !loading && updated"
    class="status-message status-ok"
  >
    Sampled at {{ sampledAt }}<span *ngIf="count != null"
      >&nbsp;&middot; {{ count }} {{ label }}</span
    >
  </span>

  <span fxFlex="1 1 auto"></span>

  <button
    mat-icon-button
    class="refresh-button"
    (click)="refresh.emit()"
    [disabled]="loading"
    matTooltip="Refresh"
    aria-label="Refresh"
  >
    <mat-icon>refresh</mat-icon>
  </button>
</section>
