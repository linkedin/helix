<section>
  <hi-list-status
    [loading]="isLoading"
    [error]="error"
    [count]="rows ? rows.length : null"
    [updated]="updated"
    label="history entries"
    emptyText="No history has been recorded yet."
    (refresh)="load()"
  ></hi-list-status>

  <div class="zone-picker" fxLayout="row" fxLayoutAlign="end center">
    <span class="zone-label">Time zone</span>
    <mat-button-toggle-group
      [value]="zone.key"
      (change)="setZone($event.value)"
      aria-label="Time zone"
    >
      <mat-button-toggle *ngFor="let z of zones" [value]="z.key">
        {{ z.label }}
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <ngx-datatable
    #historyTable
    class="material"
    [loadingIndicator]="isLoading"
    [headerHeight]="headerHeight"
    [rowHeight]="rowHeight"
    columnMode="force"
    [rows]="rows"
    [sorts]="sorts"
  >
    <ngx-datatable-column
      [name]="'Date (' + zone.label + ')'"
      prop="time"
      [width]="240"
      [canAutoResize]="false"
    >
      <ng-template let-value="value" ngx-datatable-cell-template>
        {{ format(value) }}
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Epoch Time"
      prop="time"
      [width]="200"
      [canAutoResize]="false"
    >
      <ng-template let-value="value" ngx-datatable-cell-template>
        <span>{{ value }}</span>
        <button
          mat-icon-button
          matTooltip="Copy to clipboard"
          ngxClipboard
          [cbContent]="value"
        >
          <mat-icon>content_copy</mat-icon>
        </button>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Controller"
      *ngIf="isController"
      [cellClass]="bindFunc(getControllerCellClass, this)"
    >
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Event"
      prop="event"
      *ngIf="!isController"
      [width]="110"
      [canAutoResize]="false"
      [cellClass]="bindFunc(getEventCellClass, this)"
    >
    </ngx-datatable-column>
    <ngx-datatable-column
      name="Session"
      *ngIf="!isController"
      [cellClass]="bindFunc(getSessionCellClass, this)"
    >
    </ngx-datatable-column>
  </ngx-datatable>
</section>
