<section class="diagnostics">
  <hi-list-status
    [loading]="isLoading"
    [error]="error"
    [count]="issues ? issues.length : null"
    [updated]="updated"
    label="issues"
    [hint]="readTimes"
    loadingText="Reading the cluster. A cold read can take a minute or two."
    emptyText="No cluster, instance, resource or capacity issue. Partition replica counts are on each resource's Partitions tab."
    (refresh)="load()"
  ></hi-list-status>

  <ng-container *ngIf="issues?.length">
    <div class="filters">
      <button
        type="button"
        class="chip"
        [class.active]="!severity"
        (click)="severity = null"
      >
        All severities {{ issues.length }}
      </button>
      <button
        *ngFor="let s of severities"
        type="button"
        class="chip"
        [class.active]="severity === s"
        [attr.aria-pressed]="severity === s"
        (click)="severity = s"
      >
        {{ s | titlecase }} {{ count(s, null) }}
      </button>
      <span class="gap"></span>
      <button
        type="button"
        class="chip"
        [class.active]="!category"
        (click)="category = null"
      >
        All categories
      </button>
      <button
        *ngFor="let c of categories"
        type="button"
        class="chip"
        [class.active]="category === c.value"
        [attr.aria-pressed]="category === c.value"
        (click)="category = c.value"
      >
        {{ c.label }} {{ count(null, c.value) }}
      </button>
    </div>

    <div class="table-scroll">
      <table hiResizableColumns="diagnostics">
        <thead>
          <tr>
            <th>Severity</th>
            <th>Affected</th>
            <th>Issue</th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let issue of visible" data-testid="issue">
            <td>
              <span class="badge" [ngClass]="issue.severity">
                {{ issue.severity }}
              </span>
            </td>
            <td>
              <div class="name">{{ issue.subject }}</div>
              <div class="sub">{{ categoryLabel(issue.category) }}</div>
            </td>
            <td>
              <div class="name">{{ issue.title }}</div>
              <div class="sub">{{ issue.detail }}</div>
            </td>
            <td>
              <a [routerLink]="link(issue)">{{ issue.linkLabel }}</a>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="empty" *ngIf="!visible.length" data-testid="filtered-empty">
        No issues match these filters.
      </div>
    </div>
  </ng-container>
</section>
