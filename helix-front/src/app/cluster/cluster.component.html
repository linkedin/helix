<mat-sidenav-container fxFill>
  <mat-sidenav
    #sidenav
    [mode]="isNarrowView ? 'over' : 'side'"
    [opened]="!isNarrowView || !hasCluster"
    [disableClose]="!isNarrowView"
  >
    <hi-cluster-list></hi-cluster-list>
    <div
      *ngIf="!isNarrowView"
      class="resize-handle"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize the cluster list"
      title="Drag or use the arrow keys to resize. Double click to reset."
      tabindex="0"
      (pointerdown)="startResize($event)"
      (keydown)="resizeByKey($event)"
      (dblclick)="resetWidth()"
    ></div>
  </mat-sidenav>
  <section fxFill class="content">
    <router-outlet
      (activate)="hasCluster = true"
      (deactivate)="hasCluster = false"
    ></router-outlet>
    <p *ngIf="!hasCluster" class="pick-cluster">
      Pick a cluster from the list to see its overview.
    </p>
  </section>
</mat-sidenav-container>
<button
  mat-mini-fab
  [ngClass]="['toggle-button', sidenav.opened ? 'open' : 'close']"
  color=""
  (click)="toggleSidenav()"
>
  <mat-icon>chevron_{{ sidenav.opened ? 'left' : 'right' }}</mat-icon>
</button>
